<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IITM BS Papers Downloader</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --success: #10b981;
      --error: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --primary: #7c3aed;
        --primary-hover: #6d28d9;
        --success: #059669;
        --error: #dc2626;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 380px;
      padding: 16px;
      user-select: none;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(139, 92, 246, 0.15);
      color: var(--primary);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-label { color: var(--muted); }
    .stat-val { font-weight: 700; font-family: monospace; }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.2s ease;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 8px;
    }
    .btn-secondary:hover { background: rgba(148, 163, 184, 0.1); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .log-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 11px;
      height: 100px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .log-item {
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-ok { color: var(--success); }
    .log-err { color: var(--error); }
    .log-info { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>IITM BS Papers Downloader</h1>
      <div style="font-size: 11px; color: var(--muted); margin-top: 2px;">Student Drive & Docs Importer</div>
    </div>
    <span class="badge" id="statusBadge">Ready</span>
  </header>

  <div class="card">
    <div class="stat-row">
      <span class="stat-label">Total Catalog Items</span>
      <span class="stat-val" id="totalCount">419</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Downloaded</span>
      <span class="stat-val" id="downloadedCount">0 / 419</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Current File</span>
      <span class="stat-val" id="currentFile" style="font-size: 11px; max-width: 180px; overflow: hidden; text-overflow: ellipsis;">None</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <button class="btn btn-primary" id="startBtn">Start Download (419 Papers)</button>
  <button class="btn btn-secondary" id="pauseBtn" style="display: none;">Pause Download</button>

  <div class="options">
    <label class="option-item">
      <input type="checkbox" id="saveToLocalServer" checked>
      <span>Send directly to local server (http://localhost:8000)</span>
    </label>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span>Delay between downloads:</span>
      <select id="delaySelect" style="background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font-size: 11px;">
        <option value="500">0.5s</option>
        <option value="1000" selected>1.0s</option>
        <option value="2000">2.0s</option>
      </select>
    </div>
  </div>

  <div class="log-box" id="logBox">
    <div class="log-item log-info">Ready. Click Start to begin downloading.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
